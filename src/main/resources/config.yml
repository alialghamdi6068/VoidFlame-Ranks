# ================================================================
# VoidFlame Ranks • Production Configuration
# Paper 26.2 • Java 25
# ================================================================
# Centralized rank / permission configuration.
# Persistent rank data is stored through VoidFlame-Core in:
# plugins/VoidFlame-Core/database.db
#
# IMPORTANT:
# - The canonical rank tree below is the server's default hierarchy.
# - Rank IDs are stable database identifiers; display names are editable.
# - Sr = Senior, Jr = Junior, Dev = Developer, Mod = Moderator.
# - Founder / Co-Founder are intentionally NOT used.
# - Player is intentionally NOT used; the member rank is "Member".
# - Do not place credentials or secrets in this file.

settings:
  enabled: true
  module: ranks
  default-rank: member
  allow-offline-management: true
  permission-discovery: true
  plugin-visibility: true
  contexts-enabled: true
  inheritance-enabled: true
  inheritance-max-depth: 32
  gui-page-size: 45
  save-on-change: true
  protect-owner: true
  protect-equal-rank: true
  protect-higher-ranks: true
  allow-custom-ranks: true

