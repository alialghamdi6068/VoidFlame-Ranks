tracks:
  default:
    max-rank: member
    allow-demotion: true
    allow-promotion: true
  staff:
    max-rank: jr_helper
    allow-demotion: true
    allow-promotion: true

contexts:
  enabled: true
  world: true
  server: true
  permission: true

permissions:
  discovery:
    enabled: true
    cache-seconds: 300
  plugin-visibility:
    enabled: true
    hidden-by-default: false

# ================================================================
# Direct permissions are intentionally additive.
# Higher ranks inherit lower-rank permissions through the parent tree.
# ================================================================
rank-permissions:
  member:
    - voidflame.spawn
    - voidflame.duel
    - voidflame.duel.accept
    - voidflame.queue
    - voidflame.spectate
    - voidflame.stats
